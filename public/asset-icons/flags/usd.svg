    <!-- simple stars as dots -->
    <g fill="#fff" opacity="0.95">
      <circle cx="5" cy="5" r="1.2"/><circle cx="11" cy="5" r="1.2"/><circle cx="17" cy="5" r="1.2"/><circle cx="23" cy="5" r="1.2"/>
      <circle cx="8" cy="10" r="1.2"/><circle cx="14" cy="10" r="1.2"/><circle cx="20" cy="10" r="1.2"/><circle cx="26" cy="10" r="1.2"/>
      <circle cx="5" cy="15" r="1.2"/><circle cx="11" cy="15" r="1.2"/><circle cx="17" cy="15" r="1.2"/><circle cx="23" cy="15" r="1.2"/>
      <circle cx="8" cy="20" r="1.2"/><circle cx="14" cy="20" r="1.2"/><circle cx="20" cy="20" r="1.2"/><circle cx="26" cy="20" r="1.2"/>
      <circle cx="5" cy="25" r="1.2"/><circle cx="11" cy="25" r="1.2"/><circle cx="17" cy="25" r="1.2"/><circle cx="23" cy="25" r="1.2"/>
    </g>
