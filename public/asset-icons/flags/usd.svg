<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="USD flag">
  <defs>
    <clipPath id="c">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="#fff"/>
    <!-- stripes -->
    <g fill="#D32E2E">
      <rect x="0" y="0" width="64" height="5"/>
      <rect x="0" y="10" width="64" height="5"/>
      <rect x="0" y="20" width="64" height="5"/>
      <rect x="0" y="30" width="64" height="5"/>
      <rect x="0" y="40" width="64" height="5"/>
      <rect x="0" y="50" width="64" height="5"/>
      <rect x="0" y="60" width="64" height="4"/>
    </g>
    <!-- canton -->
